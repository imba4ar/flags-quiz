<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Флаги и столицы мира</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #f5f7fa 0%, #e9edf5 100%);
            padding: 6px;
            overflow: hidden;
        }

        .container {
            max-width: 100%;
            height: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 8px 12px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 210px;
            flex-shrink: 0;
            margin-bottom: 4px;
            gap: 10px;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1;
            align-items: flex-start;
            /* не заезжать на флаг, который центрирован абсолютно */
            max-width: calc(50% - 180px);
        }

        .stats-left {
            display: flex;
            gap: 12px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1e293b;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            flex-shrink: 0;
        }
        .stats-left span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .mode-selector {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 8px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: center;
        }
        .mode-selector button {
            border: none;
            background: transparent;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #64748b;
            cursor: pointer;
            transition: 0.15s;
        }
        .mode-selector button.active {
            background: #1e293b;
            color: white;
        }
        .mode-selector button:hover:not(.active) {
            background: #e2e8f0;
        }
        .mode-selector .divider {
            width: 1px;
            height: 24px;
            background: #cbd5e1;
            margin: 0 4px;
        }
        .mode-selector .toggle-flags {
            background: #e2e8f0;
            color: #1e293b;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        .mode-selector .toggle-flags.active {
            background: #1e293b;
            color: white;
        }
        /* Режим включён, но сейчас перекрыт другим: показан не он, а вернётся при выключении верхнего. */
        .mode-selector .toggle-flags.armed {
            box-shadow: inset 0 0 0 2px #1e293b;
            color: #1e293b;
        }
        .mode-selector .toggle-flags:hover {
            opacity: 0.8;
        }

        .flag-area {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 0;
            pointer-events: none;
        }
        .flag-area img, .flag-area canvas {
            width: 320px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            border: 2px solid white;
            background: #f1f5f9;
            display: block;
            pointer-events: auto;
        }
        .flag-area canvas {
            width: 200px;
        }
        /* Диаграмма цветов — круг на прозрачном фоне: рамка и подложка флага ей не нужны. */
        .flag-area canvas.pie {
            border: none;
            background: transparent;
            box-shadow: none;
        }
        .flag-area span {
            pointer-events: none;
        }

        .right-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            z-index: 1;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .right-actions button {
            padding: 6px 16px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: 0.15s;
            cursor: pointer;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            height: 38px;
            white-space: nowrap;
        }
        .right-actions button.primary {
            background: #1e293b;
            color: white;
            border: none;
        }
        .right-actions button.primary:hover {
            background: #0f172a;
        }
        .right-actions button.secondary {
            background: #facc15;
            border: none;
            color: #0f172a;
        }
        .right-actions button.secondary:hover {
            background: #eab308;
        }
        .right-actions button.danger {
            background: #f87171;
            border: none;
            color: white;
        }
        .right-actions button.danger:hover {
            background: #ef4444;
        }
        .right-actions button.success {
            background: #4ade80;
            border: none;
            color: #0f172a;
        }
        .right-actions button.success:hover {
            background: #22c55e;
        }
        .right-actions button.hidden {
            display: none;
        }

        .result-box {
            margin: 4px 0 2px;
            padding: 8px 16px;
            border-radius: 20px;
            background: #f8fafc;
            text-align: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
            display: none;
            flex-shrink: 0;
        }
        .result-box.show {
            display: block;
        }
        .result-box.correct {
            background: #dcfce7;
            border: 2px solid #22c55e;
        }
        .result-box.wrong {
            background: #fee2e2;
            border: 2px solid #ef4444;
        }
        .result-box.skip {
            background: #f1f5f9;
            border: 2px solid #94a3b8;
        }
        .result-box.dontknow {
            background: #fef9c3;
            border: 2px solid #eab308;
        }
        .result-box .msg {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0;
        }
        .result-box .details {
            font-size: 1rem;
            color: #1e293b;
        }
        .result-box .details strong {
            color: #0f172a;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 5px;
            flex: 1;
            overflow-y: auto;
            padding: 4px 2px 6px 2px;
            align-content: start;
        }

        .options-grid button {
            height: 50px;
            font-size: 1rem;
            padding: 2px 4px;
            border-radius: 10px;
            background: white;
            border: 2px solid transparent;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.1s ease;
            cursor: pointer;
            color: #1e293b;
            font-weight: 500;
            text-align: center;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .options-grid button:hover {
            transform: scale(1.02);
            border-color: #94a3b8;
        }
        .options-grid button:active {
            transform: scale(0.97);
        }

        .options-grid button.flag-mode {
            color: white;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.9),
                         0 0 2px rgba(0, 0, 0, 0.9);
            font-weight: 700;
            border-color: rgba(255, 255, 255, 0.5);
        }
        .options-grid button.flag-mode:hover {
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Забег на время: страна уже отгадана в этом забеге и в списке нужна только как помеха. */
        .options-grid button.done {
            position: relative;
            opacity: 0.55;
        }
        .options-grid button.done::after {
            content: '✓';
            position: absolute;
            top: 1px;
            right: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1;
            color: #16a34a;
            text-shadow: 0 0 3px white, 0 0 3px white;
        }

        .options-grid::-webkit-scrollbar {
            width: 5px;
        }
        .options-grid::-webkit-scrollbar-track {
            background: #e9edf5;
            border-radius: 8px;
        }
        .options-grid::-webkit-scrollbar-thumb {
            background: #b9c4d3;
            border-radius: 8px;
        }

        /* ===== HUD режима "На время" ===== */
        .hud {
            display: none;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
            margin: 2px 0 6px;
        }
        .hud.show {
            display: flex;
        }
        .hud .pill {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 5px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e293b;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
            white-space: nowrap;
        }
        .hud .pill.timer {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 1rem;
        }
        .hud .pill .warn {
            color: #eab308;
        }
        .hud .spacer {
            flex: 1;
        }
        .hud button {
            border: none;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            background: #1e293b;
            color: white;
            height: 32px;
            white-space: nowrap;
        }
        .hud button:hover {
            opacity: 0.85;
        }

        .options-grid button.hit {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
        }
        .options-grid button.miss {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
        }

        /* ===== Оверлей с итогами ===== */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .overlay.show {
            display: flex;
        }
        .overlay-card {
            background: white;
            border-radius: 24px;
            padding: 28px 30px;
            max-width: 620px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .overlay-card h2 {
            font-size: 1.6rem;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .overlay-card .big-time {
            font-size: 3rem;
            font-weight: 800;
            color: #1e293b;
            font-variant-numeric: tabular-nums;
            margin: 8px 0 4px;
        }
        .overlay-card .sub {
            color: #475569;
            font-size: 1rem;
            margin-bottom: 18px;
        }
        .overlay-card .rounds {
            text-align: left;
            margin-bottom: 20px;
        }
        .overlay-card .round-block {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 8px;
        }
        .overlay-card .round-block .round-title {
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .overlay-card .round-block .round-title .round-err {
            color: #ef4444;
            font-weight: 600;
        }
        .overlay-card .round-block .round-countries {
            font-size: 0.85rem;
            color: #475569;
            line-height: 1.5;
        }
        .overlay-card .round-block .round-flags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }
        .overlay-card .round-block .flag-ico {
            width: 30px;
            height: 20px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            cursor: help;
        }
        .overlay-card .overlay-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .overlay-card .overlay-actions button {
            border: none;
            border-radius: 40px;
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .overlay-card .overlay-actions .again {
            background: #1e293b;
            color: white;
        }
        .overlay-card .overlay-actions .again:hover {
            background: #0f172a;
        }
        .overlay-card .overlay-actions .exit {
            background: #f1f5f9;
            color: #1e293b;
        }
        .overlay-card .overlay-actions .exit:hover {
            background: #e2e8f0;
        }

        /* ===== История забегов ===== */
        .overlay-card h3.history-title {
            text-align: left;
            font-size: 1.1rem;
            color: #0f172a;
            margin: 20px 0 10px;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }
        .history-table th {
            padding: 6px 8px;
            color: #64748b;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
        }
        .history-table td {
            padding: 6px 8px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            font-variant-numeric: tabular-nums;
        }
        .history-table td.num {
            text-align: right;
        }
        .history-table .del-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.55;
            transition: 0.15s;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .history-table .del-btn:hover {
            opacity: 1;
            background: #fee2e2;
        }
        .history-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .history-actions button {
            border: none;
            border-radius: 30px;
            padding: 5px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            background: #f1f5f9;
            color: #1e293b;
        }
        .history-actions button:hover {
            background: #e2e8f0;
        }

        /* ===== Таблица времени по странам ===== */
        .ctable {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
            margin-top: 6px;
        }
        .ctable td {
            padding: 4px 8px;
            border-bottom: 1px solid #f1f5f9;
        }
        .ctable td.t {
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }
        .ctable td.t.ok { color: #16a34a; }
        .ctable td.t.fail { color: #ef4444; }
        .ctable .flag-ico {
            width: 26px;
            height: 17px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid #e2e8f0;
            vertical-align: middle;
            margin-right: 7px;
        }
        .ctable-title {
            text-align: left;
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
            margin: 18px 0 2px;
        }

        @media (max-width: 1000px) {
            .flag-area img {
                width: 220px;
            }
            .flag-area canvas {
                width: 150px;
            }
            .top-bar {
                min-height: 150px;
            }
            .options-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 4px;
            }
            .options-grid button {
                height: 40px;
                font-size: 0.8rem;
            }
            .stats-left {
                font-size: 0.7rem;
                padding: 2px 10px;
                gap: 6px;
            }
            .right-actions button {
                font-size: 0.75rem;
                padding: 4px 10px;
                height: 32px;
            }
            .left-section {
                flex-direction: row;
                align-items: center;
                flex-wrap: wrap;
                max-width: calc(50% - 130px);
            }
            .mode-selector button {
                font-size: 0.7rem;
                padding: 2px 8px;
            }
        }

        @media (max-width: 700px) {
            .top-bar {
                flex-wrap: wrap;
                justify-content: center;
                min-height: auto;
                padding-bottom: 10px;
            }
            .left-section {
                order: 2;
                width: 100%;
                max-width: 100%;
                justify-content: center;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .flag-area {
                position: relative;
                left: auto;
                top: auto;
                transform: none;
                order: 1;
                width: 100%;
                margin-bottom: 6px;
            }
            .flag-area img {
                width: 160px;
            }
            .flag-area canvas {
                width: 120px;
            }
            .right-actions {
                order: 3;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="left-section">
                <div class="stats-left">
                    <span>✅ <span id="knownCount">0</span></span>
                    <span>❌ <span id="unknownCount">0</span></span>
                    <span>📊 <span id="totalCount">0</span></span>
                </div>
                <div class="mode-selector">
                    <button class="active" data-mode="all">Все</button>
                    <button data-mode="unknown">Не знаю</button>
                    <button data-mode="known">Знаю</button>
                    <span class="divider"></span>
                    <button id="speedModeBtn">⏱ На время</button>
                    <span class="divider"></span>
                    <button id="toggleFlags" class="toggle-flags">🏳️ Флаги</button>
                    <button id="toggleZoom" class="toggle-flags" title="Показывать только фрагмент флага">🔍 Zoom</button>
                    <button id="togglePie" class="toggle-flags" title="Показывать только доли цветов флага">🥧 Цвета</button>
                </div>
            </div>

            <div class="flag-area">
                <img id="flagImage" src="" alt="Флаг" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                <span style="display:none; color:#94a3b8; font-size:0.8rem;">нет флага</span>
                <canvas id="flagZoom" style="display:none"></canvas>
            </div>

            <div class="right-actions">
                <button class="danger hidden" id="btnDontKnow">❌ Не знаю</button>
                <button class="secondary hidden" id="btnKnow">👍 Знаю</button>
                <button class="danger hidden" id="btnMistake">😬 Я ошибся</button>
                <button class="primary hidden" id="btnNext">➡️ Далее</button>
            </div>
        </div>

        <div class="result-box" id="resultBox">
            <div class="msg" id="resultMsg">Правильно!</div>
            <div class="details" id="resultDetails">Страна: <strong>Россия</strong>, Столица: <strong>Москва</strong></div>
        </div>

        <div class="hud" id="hud">
            <div class="pill timer">⏱ <span id="hudTimer">0:00.0</span></div>
            <div class="pill">Круг <span id="hudRound">1</span></div>
            <div class="pill">В круге: <span id="hudInRound">0</span></div>
            <div class="pill">В следующий: <span id="hudCarry">0</span></div>
            <div class="pill">Ошибки: <span id="hudErrors">0</span></div>
            <div class="spacer"></div>
            <button id="speedExit">⏹ Завершить</button>
        </div>

        <div class="overlay" id="resultsOverlay">
            <div class="overlay-card">
                <h2>🏁 Готово!</h2>
                <div class="big-time" id="finalTime">0:00.0</div>
                <div class="sub" id="finalSub"></div>
            <div class="rounds" id="finalRounds"></div>
                <div class="overlay-actions">
                    <button class="again" id="speedAgain">🔁 Заново</button>
                    <button class="exit" id="speedClose">Вернуться в обычный режим</button>
                </div>

                <h3 class="history-title">📜 История забегов</h3>
                <div id="historyWrap"></div>
                <div class="history-actions">
                    <button id="historyExport">⬇️ Выгрузить JSON</button>
                    <button id="historyClear">🗑 Очистить всё</button>
                </div>
            </div>
        </div>
        <div class="options-grid" id="optionsContainer"></div>
    </div>

    <script>
        // --------------------------------------------------------------
        // 1. ДАННЫЕ (полный список стран)
        // --------------------------------------------------------------
        const COUNTRIES_DATA = [
            { name: "Австралия", capital: "Канберра", code: "au" },
            { name: "Австрия", capital: "Вена", code: "at" },
            { name: "Азербайджан", capital: "Баку", code: "az" },
            { name: "Албания", capital: "Тирана", code: "al" },
            { name: "Алжир", capital: "Алжир", code: "dz" },
            { name: "Ангола", capital: "Луанда", code: "ao" },
            { name: "Андорра", capital: "Андорра-ла-Велья", code: "ad" },
            { name: "Антигуа и Барбуда", capital: "Сент-Джонс", code: "ag" },
            { name: "Аргентина", capital: "Буэнос-Айрес", code: "ar" },
            { name: "Армения", capital: "Ереван", code: "am" },
            { name: "Афганистан", capital: "Кабул", code: "af" },
            { name: "Багамские Острова", capital: "Нассау", code: "bs" },

        // --------------------------------------------------------------
        // 3. Загрузка и сохранение
        // --------------------------------------------------------------
        function loadStats() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    stats = JSON.parse(raw);
                } else {
                    stats = {};
                }
                // Для каждой страны убедимся, что есть lastCorrect (по умолчанию false)
                allCountries.forEach(c => {
                    if (!stats[c.code]) {
                        stats[c.code] = { lastCorrect: false };
                    }
                    if (typeof stats[c.code].lastCorrect !== 'boolean') {
                        stats[c.code].lastCorrect = false;
                    }
                });
                saveStats();
            } catch (e) {
                stats = {};
                allCountries.forEach(c => {
                    stats[c.code] = { lastCorrect: false };
                });
                saveStats();
            }
        }

        function saveStats() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
        }

        // --------------------------------------------------------------
        // 4. Логика статуса страны
        // --------------------------------------------------------------
        function isCountryKnown(code) {
            return stats[code]?.lastCorrect === true;
        }

        function setCountryResult(code, correct) {
            if (!stats[code]) stats[code] = { lastCorrect: false };
            stats[code].lastCorrect = !!correct;
            saveStats();
            updateAllCounters();
        }

        // --------------------------------------------------------------
        // 5. Получение отфильтрованного списка
        // --------------------------------------------------------------
        function getFilteredCountries() {
            if (currentMode === 'all') {
                return allCountries;
            } else if (currentMode === 'unknown') {
                return allCountries.filter(c => !isCountryKnown(c.code));
            } else if (currentMode === 'known') {
                return allCountries.filter(c => isCountryKnown(c.code));
            }
            return allCountries;
        }

        // --------------------------------------------------------------
        function updateAllCounters() {
            const total = allCountries.length;
            const known = allCountries.filter(c => isCountryKnown(c.code)).length;
            const unknown = total - known;

            document.getElementById('knownCount').textContent = known;
            document.getElementById('unknownCount').textContent = unknown;
            document.getElementById('totalCount').textContent = total;

            // Обновляем надписи на кнопках режимов
            modeButtons.forEach(btn => {

                let label = '';
                if (mode === 'all') label = `Все (${total})`;
                else if (mode === 'unknown') label = `Не знаю (${unknown})`;
                else if (mode === 'known') label = `Знаю (${known})`;
                btn.textContent = label;
            });
        }

        // --------------------------------------------------------------
        // Режим Zoom: показываем не весь флаг, а его самый «информативный» фрагмент.
        // Фрагмент ищем автоматически: окно ~1/3 ширины × 2/5 высоты, скользящее по флагу,
        // оценка = количество заметных цветов + плотность границ. Так в кадр попадает герб,
        // звёзды, стык полос — а не пустая однотонная область. Для каждого флага фрагмент
        // один и тот же (кэшируется), чтобы его можно было запомнить.
        // --------------------------------------------------------------
        // Уровни отличаются размером окна и тем, за что оно награждается. На лёгком берём широкий
        // кусок и ценим разнообразие цветов — видно и эмблему, и пару полос. На сложном окно узкое,
        // и решает плотность деталей: в кадр попадает завиток герба или одна звезда. dominantLimit —
        // доля одного цвета, выше которой кусок штрафуется: иначе «сложный» вырождается в пустой
        // прямоугольник, который угадать нельзя, а не трудно. plainWin — запасное окно для флагов,
        // где деталей нет вовсе (триколоры, круг на однотонном фоне): оно всегда шире рабочего,
        // чтобы в кадр попал хотя бы стык полос.
        const ZOOM_LEVELS = {
            easy: {
                label: 'Лёгкий', win: [0.45, 0.52], shrink: null, plainWin: [0.55, 0.62],

            medium: {
