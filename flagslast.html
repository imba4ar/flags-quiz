        const OPAQUE_ALPHA = 128;        // ниже — пустая область картинки, а не цвет флага
        const zoomCropCache = new Map(); // "code:level" -> { sx, sy, sw, sh } в пикселях исходной картинки
        let zoomLoadToken = 0;

        function computeZoomCrop(img, level) {
            const analysisW = 160;
            const scale = analysisW / img.naturalWidth;
            const W = analysisW;
            const H = Math.max(1, Math.round(img.naturalHeight * scale));
            const off = document.createElement('canvas');
            off.width = W;
            off.height = H;
            const octx = off.getContext('2d', { willReadFrequently: true });
            octx.drawImage(img, 0, 0, W, H);
            const data = octx.getImageData(0, 0, W, H).data;

            // Ключ цвета (4 бита на канал) и величина градиента для каждого пикселя. Прозрачные пиксели
            // (углы картинки у флага-вымпела, например Непала) помечаются отдельно: они не цвет флага,
            // и их граница с флагом — не деталь рисунка.
            const keys = new Int32Array(W * H);
            const edges = new Float32Array(W * H);
            const gray = new Float32Array(W * H);
            const opaque = new Uint8Array(W * H);
            for (let i = 0; i < W * H; i++) {
                const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
                keys[i] = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
                gray[i] = 0.299 * r + 0.587 * g + 0.114 * b;
                opaque[i] = data[i * 4 + 3] >= OPAQUE_ALPHA ? 1 : 0;
            }
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    const i = y * W + x;
                    const dx = x + 1 < W ? Math.abs(gray[i] - gray[i + 1]) : 0;
                    const dy = y + 1 < H ? Math.abs(gray[i] - gray[i + W]) : 0;
                    edges[i] = dx + dy;
                }
            }

            // Скользящее окно wW×wH в пределах прямоугольника [x0..x1)×[y0..y1). Оценка окна:
            // число заметных цветов (≥3% площади, чтобы отсечь антиалиасинг) + плотность границ.
            // Границы считаем только во внутренней части окна: стык полос на самом краю фрагмента
            // ничего не подсказывает. weights — вес цветов и границ (на 2-м этапе цвета не важны).
            function scanWindow(wW, wH, x0, y0, x1, y1, step, colorWeight, edgeWeight, dominantLimit) {
                const area = wW * wH;
                const mx = Math.round(wW * 0.1);
                const my = Math.round(wH * 0.1);
                const innerArea = (wW - 2 * mx) * (wH - 2 * my);
                let best = { score: -Infinity, x: x0, y: y0, distinct: 0, edgeMean: 0, dominantShare: 1, wW, wH };
                // Запасной вариант на случай, когда окно не помещается в непрозрачную часть картинки.
                let fallback = { ...best, y: y0 };
                const counts = new Map();

                for (let y = y0; y + wH <= y1; y += step) {
                    for (let x = x0; x + wW <= x1; x += step) {
                        counts.clear();
                        let edgeSum = 0;
                        let transparent = 0;
                        for (let yy = y; yy < y + wH; yy++) {
                            const row = yy * W;
                            const inRow = yy >= y + my && yy < y + wH - my;
                            for (let xx = x; xx < x + wW; xx++) {
                                const i = row + xx;
                                if (!opaque[i]) {
                                    transparent++;
                                    continue;
                                }

                                counts.set(keys[i], (counts.get(keys[i]) || 0) + 1);
                                if (inRow && xx >= x + mx && xx < x + wW - mx) {
                                    edgeSum += edges[i];
                                }
                            }
                        }

                        let distinct = 0;
                        let dominant = 0;
                        for (const c of counts.values()) {
                            if (c >= area * 0.03) distinct++;
                            if (c > dominant) dominant = c;
                        }
                        const edgeMean = edgeSum / innerArea;
                        const dominantShare = dominant / area;
                        // Лёгкое предпочтение центру: у триколоров без герба стык полос в середине.
                        const cx = (x + wW / 2) / W - 0.5;
                        const cy = (y + wH / 2) / H - 0.5;
                        const centerPenalty = Math.sqrt(cx * cx + cy * cy) * 4;
                        // Кусок, залитый одним цветом, отбрасывается: загадка должна быть трудной,
                        // а не безнадёжной.
                        const blankPenalty = dominantShare > dominantLimit
                            ? (dominantShare - dominantLimit) * 2000
                            : 0;
                        const score = distinct * colorWeight + edgeMean * edgeWeight - centerPenalty - blankPenalty;
                        const candidate = { score, x, y, distinct, edgeMean, dominantShare, wW, wH };
                        if (score > fallback.score) {
                            fallback = candidate;
                        }

                        // Кусок, заметно состоящий из пустоты, загадкой не является: у флага-вымпела
                        // окно должно целиком лежать на полотне.
                        if (transparent > area * 0.05) {
                            continue;
                        }

                        if (score > best.score) {
                            best = candidate;
                        }
                    }
                }

                return best.score > -Infinity ? best : fallback;
            }

            const cfg = ZOOM_LEVELS[level] ?? ZOOM_LEVELS.medium;
            const win = (fw, fh) => [Math.max(8, Math.round(W * fw)), Math.max(8, Math.round(H * fh))];

            // Этап 1: самая информативная область флага (герб, звёзды, стык полос).
            let [wW, wH] = win(cfg.win[0], cfg.win[1]);
            let best = scanWindow(wW, wH, 0, 0, W, H, 4, cfg.colorWeight, cfg.edgeWeight, cfg.dominantLimit);

            if (best.edgeMean < 15) {
                // Флаг без деталей (полосы, круг на однотонном фоне): берём окно побольше,
                // чтобы влез хотя бы стык полос, и дальше не режем.
                [wW, wH] = win(cfg.plainWin[0], cfg.plainWin[1]);
                best = scanWindow(wW, wH, 0, 0, W, H, 4, cfg.colorWeight, cfg.edgeWeight, cfg.dominantLimit);
            } else if (cfg.shrink) {
                // Этап 2: внутри найденной области вырезаем кусок поменьше там, где деталей
                // больше всего — получается часть эмблемы, а не вся целиком.
                const [pW, pH] = [Math.max(8, Math.round(wW * cfg.shrink)), Math.max(8, Math.round(wH * cfg.shrink))];
                best = scanWindow(pW, pH, best.x, best.y, best.x + wW, best.y + wH, 2, 0, 1, cfg.dominantLimit);
            }

            return {
                sx: Math.round(best.x / scale),
                sy: Math.round(best.y / scale),
                sw: Math.round(best.wW / scale),
                sh: Math.round(best.wH / scale),
            };
        }

        // --------------------------------------------------------------
        // Режим «Цвета»: вместо флага — круговая диаграмма долей его цветов. Оттенки, отличающиеся
        // только сглаживанием краёв, сливаются в один сектор, иначе у каждого флага получался бы
        // ореол из десятка почти одинаковых долек.
        // --------------------------------------------------------------
        const PIE_MERGE_DISTANCE = 70;  // на сколько (в RGB) цвета считаются одним и тем же
        const PIE_MIN_SHARE = 0.005;    // мельче половины процента — уже не цвет флага
        const PIE_BLEND_DISTANCE = 25;  // насколько близко к смеси двух цветов, чтобы счесть кусок ореолом
        const PIE_MAX_SLICES = 8;
        const paletteCache = new Map(); // code -> [{ r, g, b, share }]

        function computePalette(img) {
            const analysisW = 160;
            const scale = analysisW / img.naturalWidth;
            const W = analysisW;
            const H = Math.max(1, Math.round(img.naturalHeight * scale));
            const off = document.createElement('canvas');
            off.width = W;
            off.height = H;
            const octx = off.getContext('2d', { willReadFrequently: true });
            octx.drawImage(img, 0, 0, W, H);
            const data = octx.getImageData(0, 0, W, H).data;

            // Считаем пиксели по грубым корзинам (5 бит на канал), потом корзины сливаем по близости.
            // Прозрачное не в счёт: у флага-вымпела (Непал) углы картинки пустые, а пустой пиксель
            // приходит чёрным с нулевой альфой — иначе пол-диаграммы занял бы несуществующий чёрный.
            const buckets = new Map();
            let opaquePixels = 0;
            for (let i = 0; i < W * H; i++) {
                if (data[i * 4 + 3] < OPAQUE_ALPHA) {
                    continue;
                }

                opaquePixels++;
                const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
                const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
                const bucket = buckets.get(key);
                if (bucket) {
                    bucket.count++;
                    bucket.r += r;
                    bucket.g += g;
                    bucket.b += b;
                } else {
                    buckets.set(key, { count: 1, r, g, b });
                }
            }

            // От самой крупной корзины к самой мелкой: каждая либо примыкает к уже набранному цвету,
            // либо становится новым. Так доминирующие цвета флага задают центры, а кайма краёв
            // растворяется в них.
            const sorted = [...buckets.values()].sort((a, b) => b.count - a.count);
            const clusters = [];
            for (const bucket of sorted) {
                const r = bucket.r / bucket.count;
                const g = bucket.g / bucket.count;
                const b = bucket.b / bucket.count;
                const near = clusters.find(c => Math.hypot(c.r - r, c.g - g, c.b - b) < PIE_MERGE_DISTANCE);
                if (near) {
                    const total = near.count + bucket.count;
                    near.r = (near.r * near.count + r * bucket.count) / total;
                    near.g = (near.g * near.count + g * bucket.count) / total;
                    near.b = (near.b * near.count + b * bucket.count) / total;
                    near.count = total;
                } else {
                    clusters.push({ r, g, b, count: bucket.count });
                }
            }

            // Мелкие доли бывают двух родов: настоящий цвет небольшой фигуры (белые звёзды Папуа — 1.5%
            // площади) и ореол сглаживания на границе двух цветов. Отличить их можно по самому цвету:
            // ореол — это смесь своих соседей, то есть лежит на отрезке между двумя более крупными
            // цветами, а звёзды не лежат ни на каком. Поэтому порог здесь низкий, а отсекаются именно
            // смеси — тогда мелкий, но настоящий цвет остаётся на диаграмме.
            const pixels = opaquePixels || 1;
            const significant = clusters.filter(c => c.count / pixels >= PIE_MIN_SHARE);
            const kept = significant
                .filter((c, i) => !IsBlendOfLarger(c, significant.slice(0, i)))
                .slice(0, PIE_MAX_SLICES);
            const keptTotal = kept.reduce((sum, c) => sum + c.count, 0) || 1;

            return kept.map(c => ({
                r: Math.round(c.r),
                g: Math.round(c.g),
                b: Math.round(c.b),
                share: c.count / keptTotal,
            }));
        }

        /// <summary>Лежит ли цвет на отрезке между какими-нибудь двумя из более крупных — то есть смесь.</summary>
        function IsBlendOfLarger(candidate, larger) {
            for (let i = 0; i < larger.length; i++) {
                for (let j = i + 1; j < larger.length; j++) {
                    if (DistanceToSegment(candidate, larger[i], larger[j]) < PIE_BLEND_DISTANCE) {
                        return true;
                    }
                }
            }

            return false;
        }

        // Расстояние от цвета до отрезка a—b в RGB. Концы отрезка не считаются: смесь лежит между
        // соседями, а не совпадает с одним из них.
        function DistanceToSegment(c, a, b) {
            const vx = b.r - a.r, vy = b.g - a.g, vz = b.b - a.b;
            const lengthSquared = vx * vx + vy * vy + vz * vz;
            if (lengthSquared === 0) {
                return Infinity;
            }

            const t = ((c.r - a.r) * vx + (c.g - a.g) * vy + (c.b - a.b) * vz) / lengthSquared;
            if (t < 0.15 || t > 0.85) {
                return Infinity;
            }

            return Math.hypot(a.r + t * vx - c.r, a.g + t * vy - c.g, a.b + t * vz - c.b);
        }

        function drawPalettePie(palette) {
            const size = 440;
            flagZoom.classList.add('pie');
            flagZoom.width = size;
            flagZoom.height = size;
            const ctx = flagZoom.getContext('2d');
            ctx.clearRect(0, 0, size, size);

            const cx = size / 2;
            const cy = size / 2;
            const radius = size * 0.45;
            let angle = -Math.PI / 2;

            palette.forEach(slice => {
                const sweep = slice.share * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, angle, angle + sweep);
                ctx.closePath();
                ctx.fillStyle = `rgb(${slice.r}, ${slice.g}, ${slice.b})`;
                ctx.fill();
                // Белые и очень светлые доли иначе сливались бы с фоном и друг с другом.
                ctx.strokeStyle = 'rgba(30, 41, 59, 0.35)';
                ctx.lineWidth = 2;
                ctx.stroke();
                angle += sweep;
            });
        }

        function drawZoomCrop(img, crop) {
            const outW = 640;
            const outH = Math.round(outW * crop.sh / crop.sw);
            flagZoom.classList.remove('pie');
            flagZoom.width = outW;
            flagZoom.height = outH;
            const ctx = flagZoom.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, outW, outH);
        }

        // Единая точка показа флага: полный, фрагмент (Zoom) или диаграмма цветов.
        function showFlag(code, full = false) {
            zoomLoadToken++;
            flagImg.nextElementSibling.style.display = 'none';
            const mode = shownMode();
            if (mode === 'flag' || full) {
                flagZoom.style.display = 'none';
                flagImg.src = `https://flagcdn.com/w320/${code}.png`;
                flagImg.style.display = 'block';
                return;
            }

            const token = zoomLoadToken;
            flagImg.style.display = 'none';
            flagZoom.style.display = 'block';
            const ctx = flagZoom.getContext('2d');
            ctx.clearRect(0, 0, flagZoom.width, flagZoom.height);

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                if (token !== zoomLoadToken) return;
                try {
                    if (mode === 'pie') {
                        let palette = paletteCache.get(code);
                        if (!palette) {
                            palette = computePalette(img);
                            paletteCache.set(code, palette);
                        }
                        drawPalettePie(palette);
                        return;
                    }

                    const cacheKey = `${code}:${zoomLevel}`;
                    let crop = zoomCropCache.get(cacheKey);
                    if (!crop) {
                        crop = computeZoomCrop(img, zoomLevel);
                        zoomCropCache.set(cacheKey, crop);
                    }
                    drawZoomCrop(img, crop);
                } catch (e) {
                    // canvas «загрязнён» (нет CORS) — показываем полный флаг
                    showFlag(code, true);
                }
            };
            img.onerror = () => {
                if (token !== zoomLoadToken) return;
                showFlag(code, true);
            };
            img.src = `https://flagcdn.com/w640/${code}.png`;
        }

        function revealFlag() {
            if ((zoomOn || pieOn) && state.currentCountry) {
                showFlag(state.currentCountry.code, true);
            }
        }

        // Кнопка перебирает уровни, чтобы не занимать место отдельным селектором: уровень написан на
        // ней самой. Выключённый Zoom помнит последний уровень — после «Цветов» или паузы игра
        // возвращается к той сложности, которую выбрали, а не к лёгкой.
        const ZOOM_LEVEL_CYCLE = ['easy', 'medium', 'hard'];

        // Режимы не гасят друг друга: включённых может быть два, а показывается включённый последним.
        // Выключаешь верхний — открывается тот, что был под ним. Кнопка показанного режима залита,
        // включённого, но перекрытого — обведена.
        function renderModeButtons() {
            const shown = shownMode();
            toggleZoomBtn.classList.toggle('active', shown === 'zoom');
            toggleZoomBtn.classList.toggle('armed', zoomOn && shown !== 'zoom');
            // Уровень написан и когда Zoom выключен: видно, на какой сложности он включится обратно.
            toggleZoomBtn.textContent = `🔍 ${ZOOM_LEVELS[zoomLevel].label}`;

            togglePieBtn.classList.toggle('active', shown === 'pie');
            togglePieBtn.classList.toggle('armed', pieOn && shown !== 'pie');
        }

        /// <summary>Что видно сейчас: последний включённый режим, а если ничего не включено — сам флаг.</summary>
        function shownMode() {
            for (let i = modeStack.length - 1; i >= 0; i--) {
                const mode = modeStack[i];
                if ((mode === 'zoom' && zoomOn) || (mode === 'pie' && pieOn)) {
                    return mode;
                }
            }

            return 'flag';
        }

        function raiseMode(mode) {
            modeStack = modeStack.filter(m => m !== mode);
            modeStack.push(mode);
        }

        // Кнопка Zoom перебирает уровни и выключение: лёгкий → средний → сложный → выкл → лёгкий…
        function toggleZoom() {
            if (!zoomOn) {
                zoomOn = true;
                zoomLevel = ZOOM_LEVEL_CYCLE[0];
            } else if (shownMode() !== 'zoom') {
                // Zoom включён, но перекрыт палитрой — нажатие просто возвращает его наверх.
            } else {
                const next = ZOOM_LEVEL_CYCLE.indexOf(zoomLevel) + 1;
                if (next >= ZOOM_LEVEL_CYCLE.length) {
                    zoomOn = false;
                } else {
                    zoomLevel = ZOOM_LEVEL_CYCLE[next];
                }
            }

            if (zoomOn) {
                raiseMode('zoom');
            }

            applyModeChange();
        }

        function togglePie() {
            pieOn = !pieOn;
            if (pieOn) {
                raiseMode('pie');
            }

            applyModeChange();
        }

        function applyModeChange() {
            renderModeButtons();
            persistDisplayMode();

            if (state.currentCountry) {
                showFlag(state.currentCountry.code, state.step === 'result');
            }
        }

        // Уровень и включённость живут отдельно: уровень переживает любое выключение.
        function persistDisplayMode() {
            try {
                localStorage.setItem(ZOOM_STORAGE_KEY, zoomLevel);
                localStorage.setItem(ZOOM_ON_STORAGE_KEY, zoomOn ? '1' : '0');
                localStorage.setItem(PIE_STORAGE_KEY, pieOn ? '1' : '0');
                localStorage.setItem(MODE_STACK_STORAGE_KEY, modeStack.join(','));
            } catch (e) {
                // приватный режим — просто не запоминаем
            }
        }

        function clearOptions() {
            optionsContainer.innerHTML = '';
        }

        function createOptionButton(text, clickHandler, countryCode = null) {
            const btn = document.createElement('button');
            btn.textContent = text;
            if (text.length > 16) {
                btn.style.fontSize = '0.75rem';
            }
            if (flagsOn && countryCode) {
                btn.style.backgroundImage = `url(https://flagcdn.com/w160/${countryCode}.png)`;
                btn.classList.add('flag-mode');
            } else {
                btn.classList.remove('flag-mode');
                btn.style.backgroundImage = '';
            }
            btn.addEventListener('click', clickHandler);
            return btn;
        }

        function renderCountryStep() {
            state.step = 'country';
            state.selectedCountry = null;

            showFlag(state.currentCountry.code);

            resultBox.classList.remove('show', 'correct', 'wrong', 'skip', 'dontknow');
            btnKnow.classList.remove('hidden');
            btnDontKnow.classList.remove('hidden');
            btnMistake.classList.add('hidden');
            btnNext.classList.add('hidden');

            clearOptions();
            sortedCountries.forEach(country => {
                const btn = createOptionButton(
                    country.name,
                    () => onCountrySelect(country),
                    country.code
                );
                optionsContainer.appendChild(btn);
            });
        }

        function onCountrySelect(country) {
            if (state.step !== 'country') return;
            state.selectedCountry = country;
            renderCapitalStep();
        }

        function renderCapitalStep() {
            state.step = 'capital';
            state.selectedCountry = null;

            btnKnow.classList.add('hidden');
            btnDontKnow.classList.add('hidden');
            btnMistake.classList.add('hidden');
            btnNext.classList.add('hidden');
            resultBox.classList.remove('show', 'correct', 'wrong', 'skip', 'dontknow');

            clearOptions();
            const shuffled = [...allCapitals].sort(() => Math.random() - 0.5);
            shuffled.forEach(capital => {
                const btn = createOptionButton(capital, () => onCapitalSelect(capital), null);
                optionsContainer.appendChild(btn);
            });
        }

        function onCapitalSelect(capital) {
            if (state.step !== 'capital') return;
            const isCorrect = (capital === state.currentCountry.capital);
            state.lastResult = isCorrect;
            // Устанавливаем статус страны
            setCountryResult(state.currentCountry.code, isCorrect);
            showResult(isCorrect ? 'correct' : 'wrong');
        }

        function onKnow() {
            if (state.step !== 'country') return;
            state.lastResult = true;
            setCountryResult(state.currentCountry.code, true);
            showResult('skipped');
        }

        function onDontKnow() {
            if (state.step !== 'country') return;
            state.lastResult = false;
            setCountryResult(state.currentCountry.code, false);
            showResult('dontknow');
        }

        function onMistake() {
            // Переводим страну в "не знаю"
            setCountryResult(state.currentCountry.code, false);
            nextQuestion();
        }

        function showResult(type) {
            state.step = 'result';
            const country = state.currentCountry;
            const correctCapital = country.capital;
            const correctName = country.name;

            revealFlag();
            clearOptions();
            btnKnow.classList.add('hidden');
            btnDontKnow.classList.add('hidden');
            btnMistake.classList.add('hidden');
            btnNext.classList.add('hidden');

            resultBox.classList.add('show');
            resultBox.classList.remove('correct', 'wrong', 'skip', 'dontknow');

            let msgText = '';
            if (type === 'correct') {
                resultBox.classList.add('correct');
                msgText = 'Правильно!';
                btnNext.classList.remove('hidden');
                btnNext.textContent = '➡️ Далее';
            } else if (type === 'wrong') {
                resultBox.classList.add('wrong');
                msgText = 'Неправильно';
                btnNext.classList.remove('hidden');
                btnNext.textContent = '➡️ Далее';
            } else if (type === 'skipped') {
                resultBox.classList.add('skip');
                msgText = 'Вы отметили "Знаю"';
                btnMistake.classList.remove('hidden');
                btnNext.classList.remove('hidden');
                btnNext.textContent = '✅ Всё верно';
            } else if (type === 'dontknow') {
                resultBox.classList.add('dontknow');
                msgText = 'Вы не знаете';
                btnNext.classList.remove('hidden');
                btnNext.textContent = '➡️ Далее';
            }
            resultMsg.textContent = msgText;
            resultDetails.innerHTML = `Страна: <strong>${correctName}</strong> &nbsp;|&nbsp; Столица: <strong>${correctCapital}</strong>`;
        }

        function nextQuestion() {
            state.currentCountry = getNextCountry();
            resultBox.classList.remove('show', 'correct', 'wrong', 'skip', 'dontknow');
            btnNext.classList.add('hidden');
            btnMistake.classList.add('hidden');
            renderCountryStep();
        }

        // --------------------------------------------------------------
        // 8b. РЕЖИМ "НА ВРЕМЯ": круги, секундомер, итоги
        // --------------------------------------------------------------
        const hud = document.getElementById('hud');
        const hudTimer = document.getElementById('hudTimer');
        const hudRound = document.getElementById('hudRound');
        const hudInRound = document.getElementById('hudInRound');
        const hudCarry = document.getElementById('hudCarry');
        const hudErrors = document.getElementById('hudErrors');
        const speedExitBtn = document.getElementById('speedExit');
        const resultsOverlay = document.getElementById('resultsOverlay');
        const finalTimeEl = document.getElementById('finalTime');
        const finalSubEl = document.getElementById('finalSub');
        const finalRoundsEl = document.getElementById('finalRounds');
        const speedModeBtn = document.getElementById('speedModeBtn');

        let speedActive = false;       // идёт ли сейчас режим на время
        let speedPool = [];            // страны, которые ещё нужно отгадать
        let speedCurrentIdx = 0;       // индекс текущей страны внутри круга
        let speedRound = 0;            // номер круга (с 1)
        let speedRoundStart = 0;       // performance.now() начала текущего круга
        let speedTotalTime = 0;        // время завершённых кругов
        let speedTimerId = null;
        let speedErrors = 0;           // всего неверных ответов
        let speedMissedThisRound = 0;  // сколько стран уйдёт в следующий круг
        let speedRoundErrorsByRound = {}; // номер круга -> ошибки в этом кругу
        let speedCountryStats = {};    // code -> { name, code, timeMs, correct }
        let speedQuestionStart = 0;    // performance.now() показа текущей страны
        let speedCurrentPool = [];     // пул для текущего круга (шафл)
        let speedRoundsLog = [];       // [{ n, time, finished, startCount, missed: [names] }]

        function fmtTime(ms) {
            const total = Math.floor(ms / 100);
            const t = Math.floor(total / 10);
            const dec = total % 10;
            const m = Math.floor(t / 60);
            const s = t % 60;
            return `${m}:${String(s).padStart(2, '0')}.${dec}`;
        }

        function speedElapsed() {
            return speedTotalTime + (performance.now() - speedRoundStart);
        }

        function speedTick() {
            hudTimer.textContent = fmtTime(speedElapsed());
        }

        function updateHud() {
            hudRound.textContent = speedRound;
            hudInRound.textContent = Math.max(0, speedCurrentPool.length - speedCurrentIdx);
            hudCarry.textContent = speedMissedThisRound;
            hudErrors.textContent = speedErrors;
        }

        function startSpeedMode() {
            speedActive = true;
            speedPool = allCountries.slice();
            speedRound = 0;
            speedTotalTime = 0;
            speedRoundStart = performance.now();
            speedErrors = 0;
            speedMissedThisRound = 0;
            speedRoundErrorsByRound = {};
            speedCountryStats = {};
            speedRoundsLog = [];

            hud.classList.add('show');
            resultBox.classList.remove('show', 'correct', 'wrong', 'skip', 'dontknow');
            document.querySelectorAll('.mode-selector button[data-mode]').forEach(btn => {
                btn.classList.add('hidden');
            });
            speedModeBtn.classList.add('active');
            speedModeBtn.textContent = '⏱ Идёт забег…';
            speedTick();
            speedTimerId = setInterval(speedTick, 100);
            speedNextRound();
        }

        function speedStopTimer() {
            if (speedTimerId !== null) {
                clearInterval(speedTimerId);
                speedTimerId = null;
            }
        }

        function restoreNormalMode() {
            hud.classList.remove('show');
            speedModeBtn.classList.remove('active');
            speedModeBtn.textContent = '⏱ На время';
            document.querySelectorAll('.mode-selector button[data-mode]').forEach(btn => {
                btn.classList.remove('hidden');
            });
            // Возврат к обычному викторинному режиму
            state.currentCountry = getNextCountry();
            resultBox.classList.remove('show', 'correct', 'wrong', 'skip', 'dontknow');
            btnNext.classList.add('hidden');
            btnMistake.classList.add('hidden');
            btnKnow.classList.remove('hidden');
            btnDontKnow.classList.remove('hidden');
            renderCountryStep();
        }

        function exitSpeedMode(showResults) {
            if (!speedActive) return;
            speedActive = false;
            speedStopTimer();
            // Закрываем незавершённый круг в логе
            const last = speedRoundsLog[speedRoundsLog.length - 1];
            if (last && !last.finished) {
                last.time = performance.now() - speedRoundStart;
                last.finished = true;
            }
            speedTotalTime += performance.now() - speedRoundStart;

            hud.classList.remove('show');
            restoreNormalMode();
            if (showResults) {
                addHistoryRecord();
                renderFinalResults();
                renderHistory();
                resultsOverlay.classList.add('show');
            }
        }

        function speedCloseResults() {
            resultsOverlay.classList.remove('show');
            if (!speedActive) restoreNormalMode();
        }

        function speedNextRound() {
            if (speedRound > 0) {
                speedTotalTime += performance.now() - speedRoundStart;
            }
            speedRound++;
            speedRoundStart = performance.now();

            speedCurrentPool = shuffleArray(speedPool);
            speedCurrentIdx = 0;
            speedMissedThisRound = 0;

            speedRoundErrorsByRound[speedRound] = 0;
            speedRoundsLog.push({ n: speedRound, time: 0, finished: false, entered: speedCurrentPool.map(c => ({ name: c.name, code: c.code })) });
            updateHud();
            speedAskCurrent();
        }

        function speedAskCurrent() {
            if (speedCurrentIdx >= speedCurrentPool.length) {
                // Круг закончен
                const roundLog = speedRoundsLog[speedRoundsLog.length - 1];
                roundLog.time = performance.now() - speedRoundStart;
                roundLog.finished = true;
                if (speedPool.length === 0) {
                    // Все страны отгаданы — стоп!
                    speedTotalTime += performance.now() - speedRoundStart;
                    speedStopTimer();
                    hud.classList.remove('show');
                    speedModeBtn.classList.remove('active');
                    speedModeBtn.textContent = '⏱ На время';
                    document.querySelectorAll('.mode-selector button[data-mode]').forEach(btn => {
                        btn.classList.remove('hidden');
                    });
                    resultBox.classList.remove('show', 'correct', 'wrong', 'skip', 'dontknow');
                    clearOptions();
                    speedActive = false;
                    addHistoryRecord();
                    renderFinalResults();
                    renderHistory();
                    resultsOverlay.classList.add('show');
                    btnKnow.classList.remove('hidden');
                    btnDontKnow.classList.remove('hidden');
                } else {
                    speedNextRound();
                }
                return;
            }
            const country = speedCurrentPool[speedCurrentIdx];
            state.currentCountry = country;
            speedQuestionStart = performance.now();
            // Показываем флаг, игрок выбирает страну
            state.step = 'country';
            btnKnow.classList.remove('hidden');
            btnDontKnow.classList.remove('hidden');
            btnMistake.classList.add('hidden');
            btnNext.classList.add('hidden');
            resultBox.classList.remove('show', 'correct', 'wrong', 'skip', 'dontknow');
            showFlag(country.code);
            renderSpeedCountryOptions();
        }

        function renderSpeedCountryOptions() {
            clearOptions();

            // Страна уходит из пула, когда её отгадали или подтвердили «Знаю» — этим и отмечаем
            // пройденное, чтобы не перебирать глазами то, что уже сделано.
            const remaining = new Set(speedPool.map(c => c.code));
            sortedCountries.forEach(c => {
                const btn = createOptionButton(c.name, () => speedOnCountrySelect(c), c.code);
                if (!remaining.has(c.code)) {
                    btn.classList.add('done');
                }

                optionsContainer.appendChild(btn);
            });
        }

        function speedOnCountrySelect(country) {
            if (!speedActive || state.step !== 'country') return;
            const isCorrect = (country.code === state.currentCountry.code);
            speedShowResult(isCorrect ? 'correct' : 'wrong', country.name);
        }

        function speedOnKnow() {
            if (!speedActive || state.step !== 'country') return;
            const country = state.currentCountry;
            speedShowResult('skipped', country.name);
        }

        function speedOnDontKnow() {
            if (!speedActive || state.step !== 'country') return;
            speedShowResult('dontknow', state.currentCountry.name);
        }

        function speedShowResult(type, selectedName) {
            state.step = 'result';
            const country = state.currentCountry;
            revealFlag();

            // Копим время, потраченное на эту страну (по всем кругам)
            if (!speedCountryStats[country.code]) {
                speedCountryStats[country.code] = { name: country.name, code: country.code, timeMs: 0, correct: false };
            }
            const st = speedCountryStats[country.code];
            st.timeMs += performance.now() - speedQuestionStart;
            if (type === 'correct') {
                st.correct = true;
            }

            if (type === 'correct') {
                // Отгадана — уходит из пула навсегда.
                // 'skipped' (Знаю) из пула НЕ удаляем: окончательное решение — за кнопкой
                // "Всё верно" (speedConfirmKnown) или "Я ошибся" (speedOnMistake).
                const idx = speedPool.findIndex(c => c.code === country.code);
                if (idx !== -1) speedPool.splice(idx, 1);
            } else if (type === 'skipped') {
                // Ждём подтверждения: ничего не считаем
            } else {
                speedErrors++;
                speedMissedThisRound++;
                if (speedRoundErrorsByRound[speedRound] !== undefined) {
                    speedRoundErrorsByRound[speedRound]++;
                }
            }
            updateHud();
            clearOptions();
            btnKnow.classList.add('hidden');
            btnDontKnow.classList.add('hidden');
            btnMistake.classList.add('hidden');
            btnNext.classList.add('hidden');

            resultBox.classList.add('show');
            resultBox.classList.remove('correct', 'wrong', 'skip', 'dontknow');

            let msgText = '';
            if (type === 'correct') {
                resultBox.classList.add('correct');
                msgText = 'Правильно!';
            } else if (type === 'wrong') {
                resultBox.classList.add('wrong');
                msgText = 'Неправильно';
            } else if (type === 'skipped') {
                resultBox.classList.add('skip');
                msgText = 'Вы отметили "Знаю"';
                btnMistake.classList.remove('hidden');
            } else if (type === 'dontknow') {
                resultBox.classList.add('dontknow');
                msgText = 'Вы не знаете';
            }
            resultMsg.textContent = msgText;
            resultDetails.innerHTML = `Страна: <strong>${country.name}</strong> &nbsp;|&nbsp; Столица: <strong>${country.capital}</strong>`;

            if (type === 'skipped') {
                btnNext.classList.remove('hidden');
                btnNext.textContent = '✅ Всё верно';
            } else {
                btnNext.classList.remove('hidden');
                btnNext.textContent = '➡️ Далее';
            }
        }

        function speedNextQuestion() {
            speedCurrentIdx++;
            updateHud();
            resultBox.classList.remove('show', 'correct', 'wrong', 'skip', 'dontknow');
            btnNext.classList.add('hidden');
            btnMistake.classList.add('hidden');
            speedAskCurrent();
        }

        function speedOnMistake() {
            if (!speedActive || state.step !== 'result') return;
            speedErrors++;
            speedMissedThisRound++;
            if (speedRoundErrorsByRound[speedRound] !== undefined) {
                speedRoundErrorsByRound[speedRound]++;
            }
            updateHud();
            speedNextQuestion();
        }

        // "Всё верно" после "Знаю" — только теперь страна окончательно уходит из пула
        function speedConfirmKnown() {
            if (!speedActive || state.step !== 'result') return;
            const country = state.currentCountry;
            const idx = speedPool.findIndex(c => c.code === country.code);
            if (idx !== -1) speedPool.splice(idx, 1);
            if (speedCountryStats[country.code]) {
                speedCountryStats[country.code].correct = true;
            }
            updateHud();
            speedNextQuestion();
        }

        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function renderFinalResults() {
            finalTimeEl.textContent = fmtTime(speedTotalTime);
            finalSubEl.textContent = `Кругов: ${speedRoundsLog.length} · Ошибок: ${speedErrors}`;
            let html = '';
            speedRoundsLog.forEach((r) => {
                const errs = speedRoundErrorsByRound[r.n] || 0;
                html += `<div class="round-block">`;
                html += `<div class="round-title"><span>Круг ${r.n} <span class="round-err">· ${errs} ошиб.</span></span><span>${fmtTime(r.time)}</span></div>`;
                if (r.n > 1 && r.entered && r.entered.length > 0) {
                    html += `<div class="round-flags">`;
                    r.entered.forEach(c => {
                        html += `<img class="flag-ico" src="https://flagcdn.com/w40/${c.code}.png" alt="${c.name}" title="${c.name}">`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            });
            finalRoundsEl.innerHTML = html;

            // Таблица: время на каждую страну, по убыванию
            const rows = Object.values(speedCountryStats).sort((a, b) => b.timeMs - a.timeMs);
            let tableHtml = '<div class="ctable-title">⏳ Время на страну</div>';
            tableHtml += '<table class="ctable"><tbody>';
            rows.forEach(r => {
                tableHtml += `<tr>` +
                    `<td><img class="flag-ico" src="https://flagcdn.com/w40/${r.code}.png" alt="" title="${r.name}">${r.name}</td>` +
                    `<td class="t ${r.correct ? 'ok' : 'fail'}">${fmtTime(r.timeMs)}</td>` +
                    `</tr>`;
            });
            tableHtml += '</tbody></table>';
            finalRoundsEl.innerHTML += tableHtml;
        }

        // --------------------------------------------------------------
        // 8c. История забегов (localStorage) + экспорт
        // --------------------------------------------------------------
        const HISTORY_KEY = 'speedrunHistory';
        const historyWrap = document.getElementById('historyWrap');

        function loadHistory() {
            try {
                const raw = localStorage.getItem(HISTORY_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveHistory(list) {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
        }

        function addHistoryRecord() {
            const list = loadHistory();
            list.push({
                date: new Date().toISOString(),
                totalTimeMs: Math.round(speedTotalTime),
                rounds: speedRoundsLog.length,
                errors: speedErrors
            });
            saveHistory(list);
        }

        function deleteHistoryRecord(idx) {
            const list = loadHistory();
            list.splice(idx, 1);
            saveHistory(list);
            renderHistory();
        }

        function clearHistory() {
            if (!confirm('Удалить всю историю забегов?')) return;
            saveHistory([]);
            renderHistory();
        }

        function fmtHistoryDate(iso) {
            const d = new Date(iso);
            const pad = (x) => String(x).padStart(2, '0');
            return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        function renderHistory() {
            const list = loadHistory().slice().reverse();
            if (list.length === 0) {
                historyWrap.innerHTML = '<div style="color:#94a3b8;font-size:0.85rem;text-align:left;">Пока нет забегов</div>';
                return;
            }
            let html = '<table class="history-table"><thead><tr>' +
                '<th>Дата и время</th><th class="num">Время</th><th class="num">Кругов</th><th class="num">Ошибок</th><th></th>' +
                '</tr></thead><tbody>';
            list.forEach((rec, i) => {
                const idx = list.length - 1 - i;
                html += `<tr>` +
                    `<td>${fmtHistoryDate(rec.date)}</td>` +
                    `<td class="num">${fmtTime(rec.totalTimeMs)}</td>` +
                    `<td class="num">${rec.rounds}</td>` +
                    `<td class="num">${rec.errors}</td>` +
                    `<td><button class="del-btn" data-idx="${idx}" title="Удалить запись">🗑</button></td>` +
                    `</tr>`;
            });
            html += '</tbody></table>';
            historyWrap.innerHTML = html;
            historyWrap.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteHistoryRecord(parseInt(btn.dataset.idx, 10)));
            });
        }

        function exportHistory() {
            const list = loadHistory();
            const blob = new Blob([JSON.stringify(list, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'speedrun-history.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --------------------------------------------------------------
        // 9. Обработчики клавиш
        // --------------------------------------------------------------
        function handleKeyDown(e) {
            const key = e.key;
            if (key === 'Escape') {
                if (speedActive) exitSpeedMode(false);
                else if (resultsOverlay.classList.contains('show')) speedCloseResults();
                return;
            }
            if (resultsOverlay.classList.contains('show')) return;
            if (speedActive) {
                if (state.step === 'country') {
                    if (key === 'Enter') {
                        e.preventDefault();
                        if (!btnKnow.classList.contains('hidden')) btnKnow.click();
                    }
                    if (key === ' ' || key === 'Space') {
                        e.preventDefault();
                        if (!btnDontKnow.classList.contains('hidden')) btnDontKnow.click();
                    }
                } else if (state.step === 'result') {
                    if (key === 'Enter') {
                        e.preventDefault();
                        if (!btnNext.classList.contains('hidden')) btnNext.click();
                    }
                    if (key === ' ' || key === 'Space') {
                        e.preventDefault();
                        if (!btnMistake.classList.contains('hidden')) btnMistake.click();
                        else if (!btnNext.classList.contains('hidden')) btnNext.click();
                    }
                }
                return;
            }
            if (state.step === 'country') {
                if (key === 'Enter') {
                    e.preventDefault();
                    if (!btnKnow.classList.contains('hidden')) btnKnow.click();
                }
                if (key === ' ' || key === 'Space') {
                    e.preventDefault();
                    if (!btnDontKnow.classList.contains('hidden')) btnDontKnow.click();
                }
            } else if (state.step === 'result') {
                if (key === 'Enter') {
                    e.preventDefault();
                    if (!btnNext.classList.contains('hidden')) btnNext.click();
                }
                if (key === ' ' || key === 'Space') {
                    e.preventDefault();
                    if (!btnMistake.classList.contains('hidden')) btnMistake.click();
                    else if (!btnNext.classList.contains('hidden')) btnNext.click();
                }
            }
        }

        // --------------------------------------------------------------
        // 10. Переключение режимов и флагов
        // --------------------------------------------------------------
        function setMode(mode) {
            if (speedActive) return;
            currentMode = mode;
            modeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            state.currentCountry = getNextCountry();
            resultBox.classList.remove('show', 'correct', 'wrong', 'skip', 'dontknow');
            btnNext.classList.add('hidden');
            btnMistake.classList.add('hidden');
            renderCountryStep();
        }

        function toggleFlags() {
            flagsOn = !flagsOn;
            toggleFlagsBtn.classList.toggle('active', flagsOn);
            if (speedActive) {
                if (state.step === 'country') renderSpeedCountryOptions();
                return;
            }
            if (state.step === 'country') {
                // перерисовать кнопки стран с новым режимом флагов
                clearOptions();
                sortedCountries.forEach(country => {
                    const btn = createOptionButton(
                        country.name,
                        () => onCountrySelect(country),
                        country.code
                    );
                    optionsContainer.appendChild(btn);
                });
            }
        }

        // --------------------------------------------------------------
        // 11. Инициализация
        // --------------------------------------------------------------
        function init() {
            loadStats();
            updateAllCounters();

            btnKnow.addEventListener('click', () => speedActive ? speedOnKnow() : onKnow());
            btnDontKnow.addEventListener('click', () => speedActive ? speedOnDontKnow() : onDontKnow());
            btnMistake.addEventListener('click', () => speedActive ? speedOnMistake() : onMistake());
            btnNext.addEventListener('click', () => {
                if (!speedActive) { nextQuestion(); return; }
                // "Всё верно" после "Знаю" = подтверждение; иначе просто Далее
                if (state.step === 'result' && !btnMistake.classList.contains('hidden')) {
                    speedConfirmKnown();
                } else {
                    speedNextQuestion();
                }
            });

            modeButtons.forEach(btn => {
                btn.addEventListener('click', () => setMode(btn.dataset.mode));
            });

            toggleFlagsBtn.addEventListener('click', toggleFlags);
            toggleZoomBtn.addEventListener('click', toggleZoom);
            togglePieBtn.addEventListener('click', togglePie);

            try {
                const savedLevel = localStorage.getItem(ZOOM_STORAGE_KEY);
                if (savedLevel && ZOOM_LEVEL_CYCLE.includes(savedLevel)) {
                    zoomLevel = savedLevel;
                }

                zoomOn = localStorage.getItem(ZOOM_ON_STORAGE_KEY) === '1';
                pieOn = localStorage.getItem(PIE_STORAGE_KEY) === '1';
                modeStack = (localStorage.getItem(MODE_STACK_STORAGE_KEY) ?? '')
                    .split(',')
                    .filter(m => m === 'zoom' || m === 'pie');
            } catch (e) {
                // приватный режим — остаёмся на значениях по умолчанию
            }

            // Включённый режим, которого нет в сохранённом порядке (первый запуск после обновления),
            // всё равно должен показаться.
            if (zoomOn && !modeStack.includes('zoom')) {
                modeStack.unshift('zoom');
            }

            if (pieOn && !modeStack.includes('pie')) {
                modeStack.push('pie');
            }

            renderModeButtons();
            speedModeBtn.addEventListener('click', () => {
                if (!speedActive) startSpeedMode();
            });
            speedExitBtn.addEventListener('click', () => exitSpeedMode(true));
            document.getElementById('speedAgain').addEventListener('click', () => {
                resultsOverlay.classList.remove('show');
                startSpeedMode();
            });
            document.getElementById('speedClose').addEventListener('click', speedCloseResults);
            document.getElementById('historyExport').addEventListener('click', exportHistory);
            document.getElementById('historyClear').addEventListener('click', clearHistory);

            document.addEventListener('keydown', handleKeyDown);

            state.currentCountry = getNextCountry();
            renderCountryStep();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
